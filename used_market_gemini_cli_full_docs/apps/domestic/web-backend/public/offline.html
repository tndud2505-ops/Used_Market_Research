<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>인터넷 연결 확인 | USED PICK</title>
    <style>
      :root { color-scheme: light; font-family: "Malgun Gothic", sans-serif; color: #182331; background: #f5f6f8; }
      body { margin: 0; padding: 24px; min-height: 80vh; display: grid; place-items: center; }
      main { width: min(100%, 480px); }
      .brand { font-size: 18px; font-weight: 800; }
      h1 { font-size: clamp(24px, 5vw, 32px); letter-spacing: -1px; }
      p { line-height: 1.7; }
      a { display: inline-block; margin-top: 16px; padding: 12px 20px; color: white; background: #b84120; border-radius: 8px; text-decoration: none; }
      a:focus-visible { outline: 3px solid #246cab; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">USED PICK</p>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>최신 매물과 시세를 보려면 인터넷 연결이 필요합니다. 연결한 뒤 다시 시도해 주세요.</p>
      <a href="">다시 시도</a>
    </main>
  </body>
</html>
