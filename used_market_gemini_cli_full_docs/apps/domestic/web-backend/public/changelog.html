        <section aria-labelledby="release-2026-11-02">
          <h2 id="release-2026-11-02"><time datetime="2026-11-02">2026.11.02</time></h2>
          <details class="changelog-entry">
            <summary>모바일에서 종류별 탭으로 필터 선택</summary>
            <figure>
              <a href="/changelog/2026-11-02-filters.png" target="_blank" rel="noopener noreferrer" aria-label="모바일 매물 필터 화면 크게 보기"><img src="/changelog/2026-11-02-filters.png" alt="칩 제조사·제품군·세대·VRAM 탭과 체크 목록, 고정된 매물 보기 버튼이 있는 모바일 필터" loading="lazy" decoding="async" width="390" height="844" /></a>
              <figcaption>상단에서 필터 종류를 고르고 목록에서 체크하며, 긴 목록을 내려도 제목과 매물 보기 버튼은 고정됩니다.</figcaption>
            </figure>
          </details>
          <details class="changelog-entry">
            <summary>가격 검색과 부품 선택을 같은 방식으로 정리</summary>
            <figure>
              <a href="/changelog/2026-11-02-model-picker.png" target="_blank" rel="noopener noreferrer" aria-label="모델 선택 화면 크게 보기"><img src="/changelog/2026-11-02-model-picker.png" alt="그래픽카드와 NVIDIA·RTX 40을 고른 뒤 모델 이름과 체크로 선택하는 목록" loading="lazy" decoding="async" width="390" height="844" /></a>
              <figcaption>부품 종류와 제조사·규격을 위쪽 탭에서 고르고, 모델 이름이나 체크를 눌러 바로 선택합니다.</figcaption>
            </figure>
          </details>
          <details class="changelog-entry">
            <summary>차트 위에서 사이트별 가격 확인</summary>
            <figure>
              <a href="/changelog/2026-11-02-price-chart.png" target="_blank" rel="noopener noreferrer" aria-label="모바일 가격 분석 화면 크게 보기"><img src="/changelog/2026-11-02-price-chart.png" alt="GTX 950 모델과 비교 조건을 한 줄에 고르고, 차트 위에서 사이트별 체크와 최근 가격을 확인하는 화면" loading="lazy" decoding="async" width="390" height="844" /></a>
              <figcaption>사이트 체크와 최근 가격을 차트 위에 모으고, 모바일 차트는 손가락으로 확대·이동할 수 있게 바꿨습니다.</figcaption>
            </figure>
          </details>
          <details class="changelog-entry">
            <summary>컴퓨터 시세를 한 줄씩 간단하게 보기</summary>
            <figure>
              <a href="/changelog/2026-11-02-computer-prices.png" target="_blank" rel="noopener noreferrer" aria-label="모바일 컴퓨터 시세 화면 크게 보기"><img src="/changelog/2026-11-02-computer-prices.png" alt="부품명·모델·수량·가격을 한 줄에 배치하고 판매중·판매완료·다나와 중에서 표시할 가격을 고르는 화면" loading="lazy" decoding="async" width="390" height="844" /></a>
              <figcaption>부품명·수량·선택한 가격을 한 줄에서 확인하고, 판매중·판매완료·다나와 표시를 바꿔 볼 수 있습니다.</figcaption>
            </figure>
          </details>
        </section>
