  <div class="adfit-layout">
    <main id="main" class="tools-main">
    <header class="sf-page-bar sf-builder-bar">
      <div class="build-heading"><h1>컴퓨터 시세</h1></div>
      <div class="sf-page-actions">
      <button class="up-button" type="button" data-action="save-build">구성 저장</button>
      <button class="up-button" type="button" data-action="print-build">인쇄</button>
    </div></header>
    <div id="tools-status" role="status" aria-live="polite">불러오는 중</div>
    <section class="sf-build-panel" aria-label="내 PC 구성">
      <div class="build-price-toolbar">
        <div class="build-price-source-field">
          <label for="build-price-source">가격 기준</label>
          <select id="build-price-source">
            <option value="" selected>국내 통합 평균</option>
            <option value="joonggonara">중고나라</option>
            <option value="bunjang">번개장터</option>
            <option value="danawa">다나와 중고 표시가</option>
          </select>
        </div>
        <div class="tools-build-price-kind" role="radiogroup" aria-label="표시할 부품 가격">
          <label><input type="radio" name="build-price-kind" value="active" checked><span>판매중</span></label>
          <label><input type="radio" name="build-price-kind" value="sold"><span>판매완료 표시가</span></label>
        </div>
      </div>
      <div id="build-table" class="tools-table-scroll" aria-label="선택 부품 표"></div>
      <p id="build-save-status" class="up-save-status" role="status" aria-live="polite" hidden></p>
    </section>

    <dialog id="compatibility-dialog" class="up-dialog build-help-dialog" aria-labelledby="compatibility-title" aria-describedby="compatibility-explanation">
      <div class="up-dialog-heading"><h2 id="compatibility-title" tabindex="-1">호환성 안내</h2><button class="up-button" type="button" data-action="close-compatibility">닫기</button></div>
      <p id="compatibility-explanation"></p><p id="compatibility-recommendation"></p><div id="compatibility-actions"></div>
    </dialog>
    <dialog id="builder-model-dialog" class="up-dialog up-picker-dialog" aria-labelledby="picker-title">
      <div class="up-dialog-heading"><h2 id="picker-title" tabindex="-1">모델 선택</h2><div class="model-picker-heading-actions"><button class="model-picker-mobile" type="button" data-action="reset-filters">초기화</button><button class="up-button model-picker-close" type="button" data-action="close-picker" aria-label="모델 선택 닫기"><span>닫기</span></button></div></div>
      <nav id="builder-categories" class="tools-tabs model-picker-mobile" aria-label="구성 부품"></nav>
      <div id="model-controls"></div>
      <nav id="model-filter-tabs" class="model-picker-mobile" role="tablist" aria-label="모델 선택 조건"></nav>
      <p id="model-filter-context" class="model-picker-mobile"></p>
      <div id="model-picker-scroll">
        <div id="model-price-status" class="tools-model-price-status" role="status" aria-live="polite" hidden></div>
        <div id="model-table" class="tools-table-scroll" tabindex="0" aria-label="부품 모델 목록"></div>
        <div id="model-facet-options" class="model-picker-mobile" role="tabpanel" hidden></div>
        <p id="model-picker-scope" class="model-picker-mobile"></p>
      </div>
      <nav id="model-pages" class="tools-pages" aria-label="모델 페이지"></nav>
    </dialog>
