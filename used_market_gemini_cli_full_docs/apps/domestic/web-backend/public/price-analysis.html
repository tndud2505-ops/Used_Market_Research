  <style>
    @media (max-width:760px) {
      body.ui-a.pc-tools #analysis-model-dialog #model-table td.analysis-model-coverage {
        display:flex; flex-wrap:wrap; align-items:baseline; gap:0 10px;
        grid-column:1/3; grid-row:2; position:static; width:auto; height:auto;
        margin:0; padding:0; overflow:visible; clip-path:none; white-space:normal;
        font-size:12px; line-height:18px;
      }
      body.ui-a.pc-tools #analysis-model-dialog #model-table .analysis-sample-date {
        margin:0; font-size:12px; line-height:18px;
      }
      body.ui-a.pc-tools #analysis-model-dialog #model-table .analysis-model-coverage[data-price-state="loading"] {
        visibility:hidden;
      }
      /* Keep the full record period available without repeating dates in the compact row. */
      body.ui-a.pc-tools #analysis-model-dialog #model-table .analysis-record-period {
        position:absolute; width:1px; height:1px; margin:-1px; padding:0;
        overflow:hidden; clip-path:inset(50%); white-space:nowrap;
      }
    }
  </style>

<body class="pc-tools ui-a" data-page="analysis" data-ui-release="search-first-v2">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="tools-header">
    <button class="tools-mobile-menu-open" type="button" data-mobile-tools="menu" aria-label="메뉴" aria-haspopup="dialog" aria-controls="tools-menu-dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>메뉴</span></button>
    <a class="brand" href="/" aria-label="USED PICK 홈"><img src="/assets/mark.svg" alt=""><span class="brand-used">USED</span><span class="brand-pick">PICK</span></a>
    <nav aria-label="주 메뉴"><a href="/">검색</a><a href="/computer-builder.html">컴퓨터 시세</a></nav>
    <nav class="up-header-links" aria-label="이용 및 정책"><a href="/changelog.html">패치 내역</a><a href="/support.html">후원</a><a href="/contact.html">문의</a><a href="/guide.html">이용 안내</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></nav>
  </header>
  <div class="adfit-layout">
    <main id="main" class="tools-main">
    <header class="market-page-heading">
      <div class="market-heading-content">
        <h1 id="analysis-title"><button id="analysis-model-select" type="button" data-action="open-analysis-picker" aria-label="가격을 비교할 모델 변경" aria-haspopup="dialog" aria-controls="analysis-model-dialog">모델 선택</button></h1>
        <label class="analysis-kind-field" for="chart-kind-select"><span class="analysis-sr-only">가격 종류</span><select id="chart-kind-select" name="price-kind"><option value="active">판매중</option><option value="sold">판매완료</option></select></label>
        <label class="market-filter-field analysis-legacy-control" for="chart-sources" hidden><span class="analysis-sr-only">비교 사이트</span><select id="chart-sources" aria-label="차트 사이트" hidden></select></label>
        <button id="mobile-chart-source" class="tools-mobile-selector analysis-legacy-control" type="button" data-mobile-tools="source" aria-haspopup="dialog" aria-controls="tools-choice-dialog" hidden><span id="mobile-chart-source-label">전체 비교</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="mobile-chart-kind" class="tools-mobile-selector analysis-legacy-control" type="button" data-mobile-tools="kind" aria-haspopup="dialog" aria-controls="tools-choice-dialog" hidden><span id="mobile-chart-kind-label">판매중</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="market-heading-actions">
        <a id="analysis-listing-link" href="/" aria-label="이 모델 매물 보기"><span class="tools-listing-label">매물 보기</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 5H5v15h15v-5"/></svg></a>
        <button id="price-window-close" type="button" data-action="close-price-window" aria-label="시세 창 닫기">닫기</button>
      </div>
    </header>
    <div id="tools-status" role="status" aria-live="polite">불러오는 중</div>
    <div class="analysis-kind-tabs" role="group" aria-label="가격 비교 조건">
      <div id="chart-price-kind" class="market-price-tabs" role="group" aria-label="가격 종류">
        <button type="button" data-action="price-kind" data-kind="active" aria-pressed="true">판매중</button>
        <button type="button" data-action="price-kind" data-kind="sold" aria-pressed="false">판매완료</button>
      </div>
      <div id="chart-fx" class="market-chart-fx" hidden><span class="market-currency-toggle" role="group" aria-label="표시 통화" aria-describedby="chart-fx-rate"><button type="button" data-action="display-currency" data-currency="KRW" aria-pressed="true">원</button><button type="button" data-action="display-currency" data-currency="USD" aria-pressed="false">USD</button></span></div>
    </div>
    <div class="analysis-chart-controls">
      <form id="chart-range-form" class="analysis-range-form">
        <label for="chart-date-from"><span class="analysis-sr-only">조회 시작일</span><input id="chart-date-from" name="from" type="date" aria-describedby="chart-range-status"></label>
        <span class="analysis-range-separator" aria-hidden="true">~</span>
        <label for="chart-date-to"><span class="analysis-sr-only">조회 종료일</span><input id="chart-date-to" name="to" type="date" aria-describedby="chart-range-status"></label>
        <button type="submit">조회</button>
      </form>
      <p id="chart-range-status" role="status" hidden></p>
      <span id="chart-history-status" role="status" aria-live="polite"></span>
    </div>
    <section id="analysis-workspace" aria-label="모델별 가격 추이와 출처별 가격" data-prices-open="true">
      <div id="analysis-chart-pane">
        <h2 id="price-chart-heading" class="analysis-sr-only">가격 추이</h2>
        <div id="price-chart" class="market-chart" role="region" aria-labelledby="price-chart-heading"></div>
        <p id="chart-coverage" class="tools-caption" hidden></p>
        <div class="market-chart-foot">
          <p id="chart-sold-note" hidden>판매완료 표시가는 실제 거래 체결가와 다를 수 있습니다.</p>
        </div>
      </div>
      <aside id="analysis-price-rail" class="market-price-rail" aria-label="사이트별 가격">
        <header><h2 id="analysis-readout-title">최근 가격</h2><div class="analysis-readout-actions"><button id="analysis-readout-reset" type="button" data-action="clear-chart-date" aria-label="최근 관측 가격으로 돌아가기" hidden>최근</button><button type="button" data-action="compare-sources" role="switch" aria-checked="false">비교<span aria-hidden="true"></span></button></div></header>
        <div id="analysis-prices" class="market-latest-prices" aria-label="최근 대표가격과 참고값"></div>
        <details id="chart-fx-note" hidden><summary>환율 기준</summary><span id="chart-fx-rate"></span></details>
      </aside>
    </section>
    <dialog id="analysis-model-dialog" class="up-dialog up-picker-dialog" aria-labelledby="analysis-picker-title">
      <div class="up-dialog-heading"><h2 id="analysis-picker-title" tabindex="-1">모델 선택</h2><div class="model-picker-heading-actions"><button class="model-picker-mobile" type="button" data-action="reset-filters">초기화</button><button class="up-button model-picker-close" type="button" data-action="close-analysis-picker" aria-label="모델 선택 닫기"><span>닫기</span></button></div></div>
      <nav id="analysis-categories" class="tools-tabs" aria-label="분석 부품"></nav>
      <div id="model-controls"></div>
      <nav id="model-filter-tabs" class="model-picker-mobile" role="tablist" aria-label="모델 선택 조건"></nav>
      <p id="model-filter-context" class="model-picker-mobile"></p>
      <div id="model-picker-scroll">
        <div id="model-table" class="tools-table-scroll" tabindex="0" aria-label="부품 모델 목록"></div>
        <div id="model-facet-options" class="model-picker-mobile" role="tabpanel" hidden></div>
        <p id="model-picker-scope" class="model-picker-mobile"></p>
      </div>
      <nav id="model-pages" class="tools-pages" aria-label="모델 페이지"></nav>
    </dialog>
    <dialog id="tools-choice-dialog" class="tools-mobile-sheet" aria-labelledby="tools-choice-title">
      <div class="tools-sheet-handle" aria-hidden="true"></div>
      <div class="tools-sheet-heading"><h2 id="tools-choice-title" tabindex="-1">비교 사이트</h2><button type="button" data-close-tools-dialog aria-label="선택 화면 닫기">×</button></div>
      <div id="tools-choice-list" class="tools-choice-list" role="radiogroup" aria-labelledby="tools-choice-title"></div>
    </dialog>

  </main>
    <aside class="adfit-banner" id="adfit-rail" data-placement="rail" aria-label="카카오 AdFit 광고" hidden>
      <template data-format="desktop"><ins class="kakao_ad_area" style="display:none;" data-ad-unit="DAN-gG0WEoycq7Nup5kT" data-ad-width="160" data-ad-height="600"></ins></template>
    </aside>
    <aside class="adfit-banner train-gallery-promotion" id="adfit-banner" data-placement="bottom" data-provider="house" aria-label="Train Gallery 자사 앱 광고" hidden>
      <a class="train-gallery-promotion__link" href="https://play.google.com/store/apps/details?id=com.trainingapp.traingallery" target="_blank" rel="sponsored noopener noreferrer" aria-label="Train Gallery — 운동 달력과 브이로그 편집. Google Play에서 보기 (새 창)">
        <img class="train-gallery-mobile-art" src="/promotions/train-gallery/slim.webp" width="2172" height="724" alt="트레인갤러리 — 운동 달력·브이로그 편집" loading="lazy" decoding="async" />
        <div class="train-gallery-desktop-art" aria-hidden="true">
          <video class="train-gallery-moa" muted playsinline preload="none" poster="/promotions/train-gallery/moa-poster.png" data-motion-src="/promotions/train-gallery/moa-lift.mp4" tabindex="-1"></video>
          <div class="train-gallery-copy"><strong>트레인갤러리</strong><span>운동을 기록하고 영상으로 남겨요.</span></div>
          <figure class="train-gallery-calendar"><figcaption>운동 달력</figcaption><div class="train-gallery-calendar-window"><img src="/promotions/train-gallery/calendar.webp" alt="" width="1080" height="2400" loading="lazy" decoding="async" /></div></figure>
          <figure class="train-gallery-editor"><figcaption>브이로그 편집</figcaption><div class="train-gallery-editor-window"><video muted playsinline preload="none" poster="/promotions/train-gallery/exercise-poster.jpg" data-src="/promotions/train-gallery/exercise.mp4" tabindex="-1"></video><div class="train-gallery-timeline-window"><img src="/promotions/train-gallery/vlog.webp" alt="" width="1080" height="2400" loading="lazy" decoding="async" /></div></div></figure>
        </div>
        <span class="train-gallery-promotion__caption"><span>자사 앱 광고</span><span>Google Play에서 보기 ↗</span></span>
      </a>
      <button class="train-gallery-motion-toggle" type="button" data-motion-toggle aria-label="배너 동작 재생" hidden>▶</button>
    </aside>
  </div>
  <dialog id="tools-menu-dialog" class="tools-mobile-sheet" aria-labelledby="tools-menu-title">
    <div class="tools-sheet-handle" aria-hidden="true"></div>
    <div class="tools-sheet-heading"><h2 id="tools-menu-title" tabindex="-1">메뉴</h2><button type="button" data-close-tools-dialog aria-label="메뉴 닫기">×</button></div>

  </dialog>
