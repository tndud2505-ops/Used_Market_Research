<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC 부품 가격 분석 | USED PICK</title>
  <meta name="description" content="PC 부품의 판매중 가격, 판매완료 표시가와 확인 거래가의 변화를 모델별로 비교하세요.">
  <link rel="canonical" href="https://used-pick.com/price-analysis.html">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=pc-tools-v1"><link rel="stylesheet" href="/pc-tools.css?v=price-clarity-v1"><link rel="stylesheet" href="/ui-concept-a.css?v=aligned-shell-v1">
  <link rel="stylesheet" href="/pc-workspace.css?v=chart-corners-v8">
  <link rel="stylesheet" href="/adfit-layout.css?v=adfit-all-v3">
  <link rel="stylesheet" href="/site-header-links.css?v=1">
</head>
<body class="pc-tools ui-a" data-page="analysis" data-ui-release="search-first-v2">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="tools-header">
    <a class="brand" href="/" aria-label="USED PICK 홈"><img src="/assets/mark.svg" alt=""><span class="brand-used">USED</span><span class="brand-pick">PICK</span></a>
    <nav aria-label="주 메뉴"><a href="/">중고 시세</a><a href="/computer-builder.html">컴퓨터 맞추기</a><a href="/price-analysis.html" aria-current="page">가격 분석</a></nav>
    <nav class="up-header-links" aria-label="이용 및 정책"><a href="/guide.html">이용 안내</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></nav>
  </header>
  <div class="adfit-layout">
    <main id="main" class="tools-main">
    <header class="market-page-heading"><div><h1 id="analysis-title">가격 분석</h1><button id="analysis-model-select" type="button" data-action="open-analysis-picker" aria-haspopup="dialog" aria-controls="analysis-model-dialog">모델 선택</button></div><a id="analysis-listing-link" href="/">매물 보기 ↗</a></header>
    <div id="tools-status" role="status" aria-live="polite">불러오는 중</div>
    <div class="market-toolbar">
      <select id="chart-sources" aria-label="차트 사이트"></select>
      <select id="chart-price-kind" aria-label="가격 종류"><option value="active">판매중 가격</option><option value="sold">판매완료 표시가</option></select>
      <span id="chart-history-status" role="status" aria-live="polite"></span>
    </div>
    <section id="analysis-workspace" aria-label="가격 분석" data-prices-open="false">
      <div id="analysis-chart-pane"><button id="chart-latest-toggle" type="button" data-action="toggle-latest-prices" aria-label="최근 가격 펼치기" aria-expanded="false" aria-controls="analysis-price-rail" title="최근 가격">+</button><div id="price-chart" class="market-chart"></div><p id="chart-coverage" class="tools-caption" hidden></p></div>
      <aside id="analysis-price-rail" class="market-price-rail" aria-label="사이트별 최신 가격" hidden>
        <header><h2>최근 가격</h2><button type="button" data-action="toggle-latest-prices" aria-label="최근 가격 닫기">×</button></header>
        <div id="analysis-prices" class="market-latest-prices" aria-label="최근 대표가격과 참고값"></div>
      </aside>
    </section>
    <dialog id="analysis-model-dialog" class="up-dialog up-picker-dialog" aria-labelledby="analysis-picker-title">
      <div class="up-dialog-heading"><h2 id="analysis-picker-title" tabindex="-1">분석 모델 선택</h2><button class="up-button" type="button" data-action="close-analysis-picker">닫기</button></div>
      <nav id="analysis-categories" class="tools-tabs" aria-label="분석 부품"></nav>
      <div id="model-controls"></div>
      <div id="model-table" class="tools-table-scroll" tabindex="0" aria-label="부품 모델 목록"></div><nav id="model-pages" class="tools-pages" aria-label="모델 페이지"></nav>
    </dialog>

  </main>
    <aside class="adfit-banner" id="adfit-rail" data-placement="rail" aria-label="카카오 AdFit 광고" hidden>
      <template data-format="desktop"><ins class="kakao_ad_area" style="display:none;" data-ad-unit="DAN-gG0WEoycq7Nup5kT" data-ad-width="160" data-ad-height="600"></ins></template>
    </aside>
    <aside class="adfit-banner" id="adfit-banner" data-placement="bottom" aria-label="카카오 AdFit 광고" hidden>
      <template data-format="mobile"><ins class="kakao_ad_area" style="display:none;" data-ad-unit="DAN-gvTVDnxVn9S3leR5" data-ad-width="320" data-ad-height="100"></ins></template>
    </aside>
  </div>
  <script type="module" src="/pc-tools.js?v=adfit-all-v3"></script>
</body>
</html>
