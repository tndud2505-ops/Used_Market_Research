<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC 부품 가격 분석 | USED PICK</title>
  <meta name="description" content="PC 부품의 판매중 가격, 판매완료 표시가와 확인 거래가의 변화를 모델별로 비교하세요.">
  <link rel="canonical" href="https://used-pick.com/price-analysis.html">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=pc-tools-v1"><link rel="stylesheet" href="/pc-tools.css?v=parts-ux-v4"><link rel="stylesheet" href="/ui-concept-a.css?v=search-first-v2">
</head>
<body class="pc-tools ui-a" data-page="analysis" data-ui-release="search-first-v2">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="tools-header">
    <a class="brand" href="/" aria-label="USED PICK 홈"><img src="/assets/mark.svg" alt=""><span class="brand-used">USED</span><span class="brand-pick">PICK</span></a>
    <nav aria-label="주 메뉴"><a href="/">중고 시세</a><a href="/computer-builder.html">컴퓨터 맞추기</a><a href="/price-analysis.html" aria-current="page">가격 분석</a></nav>
    <a class="up-header-help" href="/guide.html">이용 안내</a>
  </header>
  <main id="main" class="tools-main">
    <header class="sf-page-bar"><h1 id="analysis-title">가격 분석</h1><a id="analysis-listing-link" class="up-button" href="/">현재 매물 보기</a></header>
    <div id="tools-status" role="status" aria-live="polite">불러오는 중</div>
    <div class="sf-analysis-tools">
      <div class="sf-analysis-model"><span>모델 선택</span><button id="analysis-model-select" class="up-button" type="button" data-action="open-analysis-picker" aria-haspopup="dialog" aria-controls="analysis-model-dialog">모델 선택</button></div>
      <div id="chart-sources" class="tools-tabs" role="group" aria-label="차트 사이트"></div>
      <div id="chart-navigation" class="tools-chart-controls chart-period" role="group" aria-label="분석 기간"></div>
    </div>
    <section class="sf-analysis-chart" aria-labelledby="chart-title">
      <h2 id="chart-title">가격 추이</h2>
      <div id="price-chart" class="tools-chart"></div><p id="chart-coverage" class="tools-caption" hidden></p>
    </section>
    <section class="sf-source-comparison" aria-label="출처별 가격 비교"><div id="analysis-source-comparison" aria-live="polite"></div></section>
    <dialog id="analysis-model-dialog" class="up-dialog up-picker-dialog" aria-labelledby="analysis-picker-title">
      <div class="up-dialog-heading"><h2 id="analysis-picker-title" tabindex="-1">분석 모델 선택</h2><button class="up-button" type="button" data-action="close-analysis-picker">닫기</button></div>
      <nav id="analysis-categories" class="tools-tabs" aria-label="분석 부품"></nav>
      <div id="model-controls"></div>
      <div id="model-table" class="tools-table-scroll" tabindex="0" aria-label="부품 모델 목록"></div><nav id="model-pages" class="tools-pages" aria-label="모델 페이지"></nav>
    </dialog>
    <aside class="adfit-banner" id="adfit-banner" aria-label="카카오 AdFit 광고" hidden>
      <ins class="kakao_ad_area" style="display:none;"
        data-ad-unit = "DAN-gvTVDnxVn9S3leR5"
        data-ad-width = "320"
        data-ad-height = "100"></ins>
    </aside>
  </main>
  <footer class="tools-footer"><a href="/guide.html">이용 안내</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></footer>
  <script type="module" src="/pc-tools.js?v=search-first-v2"></script>
</body>
</html>
