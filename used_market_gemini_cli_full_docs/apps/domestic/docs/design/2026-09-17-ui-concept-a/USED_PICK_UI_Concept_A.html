function unavailable(){if(state.ui==='loading')return `<div role="status" aria-label="불러오는 중"><div class="skeleton" style="width:40%"></div><div class="skeleton big"></div><div class="skeleton big"></div><div class="skeleton big"></div></div>`;const configs={error:['refresh','가격을 불러오지 못했어요','조회 오류입니다. 자료가 없는 상태와 구분해 안내합니다.','다시 시도'],empty:['search','조건에 맞는 매물이 없어요','모델명이나 제조사 조건을 조금 넓혀보세요.','조건 초기화']};const c=configs[state.ui]||configs.empty;return `<div class="empty" role="status">${icon(c[0])}<h3>${c[1]}</h3><p>${c[2]}</p><button class="btn" data-action="recover">${c[3]}</button></div>`;}
function market(){const m=current(),match=selectedModels();if(!match.length)return `${heading('USED PARTS, CLEAR PRICES.','조건에 맞는 모델을 찾아보세요.','검색어와 제조사 조건을 바꾸어 다시 확인할 수 있습니다.')}${cats()}<div class="market-layout">${filters()}<section class="panel">${unavailable()}</section></div>`;return `${heading('USED PARTS, CLEAR PRICES.','중고 부품, 가격부터 비교하세요.','찾는 모델의 현재 매물과 판매완료 표시가를 한곳에서 확인하세요.',`<span class="pill">${icon('shield')} 표시가격 비교 서비스</span>`)}${cats()}<div class="filter-mobile"><span class="pill orange">${esc(group(state.category)[1])} · ${esc(state.brand)}</span><button class="btn" data-action="open-filter">${icon('filter')} 필터</button></div><div class="market-layout">${filters()}<div class="stack"><section class="panel" aria-label="선택 모델 가격 요약"><div class="model-top"><div class="model-kicker"><span>${group(state.category)[1]} / ${esc(m.brand)}</span><span class="pill ${m.detail.includes('정확 모델 기준')?'green':'soft'}" style="font-size:10px;padding:2px 7px">${m.detail.includes('정확 모델 기준')?'모델별 비교':'구간·규격 참고'}</span></div><div class="model-heading"><div><h2>${esc(m.short)}</h2><p>${esc(m.detail)}</p></div><div class="model-picker"><label for="market-model" class="sr-only">비교 모델 변경</label><select id="market-model">${optionList(match.length?match:models.filter(x=>x.cat===state.category),state.model)}</select></div></div><div class="metrics"><div class="metric"><div class="metric-label"><span class="dot"></span>판매중 등록가 평균</div><strong class="num">${state.ui==='normal'?money(m.ask):'—'}${state.ui==='normal'?'<em>원</em>':''}</strong><small>${state.ui==='low'?'표본 부족 · 2건 / 대표값 미제공':state.ui==='normal'?`관측 표본 ${m.n}건 · 예시`:'현재 상태에서는 대표값 미제공'}</small></div><div class="metric"><div class="metric-label"><span class="dot teal"></span>판매완료 표시가 평균</div><strong class="num">${state.ui==='normal'&&m.sold!==null?money(m.sold):'—'}${state.ui==='normal'&&m.sold!==null?'<em>원</em>':''}</strong><small>${state.ui==='low'?'표본 부족 · 1건 / 대표값 미제공':state.ui==='normal'?`관측 표본 ${m.s}건 · 실제 체결가 아님`:'현재 상태에서는 대표값 미제공'}</small></div><div class="metric"><div class="metric-label"><span class="dot gray"></span>비교 범위</div><strong style="font-size:20px;line-height:1.95">국내 · KRW</strong><small>최근 30일 · 통계 예시</small></div></div></div><div class="model-foot"><span>판매완료 가격은 마지막 표시가격입니다.</span><a href="#analysis">가격 변화 자세히 보기 ${icon('arrow')}</a></div></section><section class="panel" aria-label="현재 매물"><div class="listing-head"><h2>현재 매물 <small>예시 ${state.ui==='empty'?0:state.source==='전체'?4:2}건</small></h2><label class="sr-only" for="sort">매물 정렬</label><select class="sort-select" id="sort"><option value="recent" ${state.sort==='recent'?'selected':''}>최근 수집순</option><option value="asc" ${state.sort==='asc'?'selected':''}>낮은 가격순</option><option value="desc" ${state.sort==='desc'?'selected':''}>높은 가격순</option></select></div><div class="source-tabs" role="group" aria-label="매물 출처">${['전체','중고나라','번개장터'].map(s=>`<button data-source="${s}" class="${state.source===s?'active':''}">${s}${s==='전체'?' 4':''}</button>`).join('')}<button data-action="scope-help">시장군 안내 ⓘ</button></div>${['error','loading','empty'].includes(state.ui)||!match.length?unavailable():listings(m)}<div class="pager" aria-label="예시 페이지"><button disabled aria-label="이전 페이지">‹</button><button class="active" aria-current="page">1</button><button disabled aria-label="다음 페이지">›</button></div></section><div class="method-note">${icon('info')}<p>예시 매물입니다. 실제 서비스에서는 가격·상태·구성품을 원문에서 확인하세요. 광고는 검색 결과와 분리해 표시합니다.</p></div></div></div>`;}
function listings(m){let data=[{title:`${m.short} 판매합니다`,source:'중고나라',ago:'12분 전 수집',price:Math.round(m.ask*.93/1000)*1000,tag:'기본 구성'},{title:`${m.short} · 사용하던 부품 정리`,source:'번개장터',ago:'38분 전 수집',price:Math.round(m.ask*.98/1000)*1000,tag:'구성품 원문 확인'},{title:`${m.short} 중고 판매`,source:'중고나라',ago:'1시간 전 수집',price:Math.round(m.ask*1.02/1000)*1000,tag:'상태 원문 확인'},{title:`${m.short} 박스 포함`,source:'번개장터',ago:'2시간 전 수집',price:Math.round(m.ask*1.07/1000)*1000,tag:'박스 포함'}];if(state.source!=='전체')data=data.filter(d=>d.source===state.source);if(state.sort==='asc')data.sort((a,b)=>a.price-b.price);if(state.sort==='desc')data.sort((a,b)=>b.price-a.price);return data.map(d=>`<article class="listing"><div class="thumb" aria-label="예시 썸네일">${icon(group(m.cat)[2])}<small>PREVIEW</small></div><div><h3 class="listing-title">${esc(d.title)}</h3><div class="listing-meta"><span class="source-tag">${d.source}</span><span>${d.ago}</span><span>${d.tag}</span></div></div><div class="listing-price"><strong class="num">${money(d.price)}<small>원</small></strong><button data-action="original">원문 보기 ↗</button></div></article>`).join('');}
function totals(){let ask=0,sold=0,aN=0,sN=0,units=0;for(const v of Object.values(state.build)){const m=byId(v.id);if(!m)continue;units+=v.q;if(m.ask!==null){ask+=m.ask*v.q;aN+=v.q;}if(m.sold!==null){sold+=m.sold*v.q;sN+=v.q;}}return {ask,sold,aN,sN,units,selected:Object.keys(state.build).length};}
function builder(){const t=totals();return `${heading('YOUR BUILD, YOUR BUDGET.','내 PC 구성, 시세로 확인하세요.','부품별 가격을 비교하고, 수량을 조절해 나만의 구성을 저장하세요.',`<button class="btn heading-action" data-action="load">${icon('save')} 저장한 예시 불러오기</button>`)}<div class="builder-layout"><div class="builder-main"><section class="panel"><div class="panel-head"><div class="build-top"><h2>선택한 부품</h2><small>${t.selected} / 9개 부품군</small></div><span class="pill soft" style="font-size:10px;padding:4px 8px">시안용 구성</span></div><div class="build-labels"><span>부품</span><span>선택 모델 / 수량</span><span>등록가 / 완료 표시가</span></div>${parts.map(([cat,label,i])=>buildRow(cat,label,i)).join('')}</section><div class="warning">${icon('warning')}<div><strong>호환성은 최종 확인이 필요합니다.</strong><p>선택 모델의 소켓·메모리 규격·전력·크기를 확인하세요. 이 시안은 호환성 판정 엔진에 연결되지 않았습니다.</p></div></div><div class="panel builder-tip"><h3>가격이 없는 부품은 0원으로 계산하지 않습니다.</h3><p>표본 부족·조회 실패·통계 미제공은 합계에서 제외하고, 확인된 부분 합계와 제외 사유를 따로 표시합니다.</p></div></div><aside class="panel summary-card" id="build-summary" aria-label="견적 요약"><div class="summary-label"><h2>내 구성 요약</h2><span class="pill orange" style="font-size:10px;padding:4px 8px">${t.selected}개 부품군 선택</span></div><div class="total-label">판매중 등록가 기준 부분 합계</div><div class="total num">${money(Math.round(t.ask))}<span>원</span></div><div class="summary-detail"><span>가격 확인 ${t.aN} / ${t.units}개</span><span>KRW · 예시</span></div><div class="total-label">판매완료 표시가 기준 부분 합계</div><div class="sold-total num">${money(Math.round(t.sold))}<span> 원</span></div><div class="summary-detail"><span>가격 확인 ${t.sN} / ${t.units}개</span><span>실제 체결가 아님</span></div><div class="summary-note">${t.selected<9?`아직 선택하지 않은 부품군이 ${9-t.selected}개 있습니다.`:'9개 부품군을 모두 선택했습니다.'}<br>선택 부품의 참고 합계이며 완성 PC의 판매가격이 아닙니다.</div><button class="btn dark" data-action="save">${icon('save')} 이 구성 저장하기</button><button class="btn" data-action="print">구성표 인쇄하기</button><div class="summary-footer">단가의 소수 정밀도는 유지하고 최종 합계만 원 단위로 반올림합니다. RAM은 모듈 1개 단가입니다. 배송비 등 추가 비용은 포함하지 않습니다.<br><br>미리보기 저장은 이 브라우저의 별도 시안 키에만 저장됩니다. 운영 견적에는 영향을 주지 않습니다.</div></aside></div><div class="mobile-total"><div><span>확인된 등록가 부분 합계</span><strong>${money(Math.round(t.ask))}원</strong></div><a href="#build-summary" data-action="jump-summary">요약 보기 ↓</a></div>`;}
function buildRow(cat,label,i){const item=state.build[cat],m=item?byId(item.id):null;return `<div class="build-row"><div class="part-name"><span class="part-icon">${icon(i)}</span>${label}</div>${m?`<div><div class="chosen-name">${esc(m.short)}</div><div class="row-extra"><span class="qty"><button data-qty="${cat}" data-delta="-1" aria-label="${label} 수량 줄이기">−</button><b>${item.q}</b><button data-qty="${cat}" data-delta="1" aria-label="${label} 수량 늘리기">+</button></span>${cat==='RAM'?`16GB × ${item.q} = ${item.q*16}GB`:'단가 '+money(m.ask)+'원'}<button class="link-btn" style="font-size:10px" data-pick="${cat}">변경</button></div></div><div class="row-money"><div><strong class="num">${money(m.ask*item.q)}원</strong><small>${m.sold===null?'완료가 표본 부족':money(m.sold*item.q)+'원 · 완료 표시가'}</small></div><button class="delete" data-remove="${cat}">삭제</button></div>`:`<div style="grid-column:2/-1"><button class="add-part" data-pick="${cat}">+ ${label} 선택하기</button></div>`}</div>`;}
function chart(m){const mobile=window.innerWidth<=600,W=mobile?340:800,H=mobile?224:266,left=mobile?43:61,right=mobile?12:24,top=23,bottom=35;const values=state.period===7?[1.04,1.025,1.02,null,1.01,.995,1]:state.period===90?[1.2,1.17,1.18,null,1.1,1.11,1.09,1.06,null,1.05,1.03,1]:[1.15,1.13,1.14,1.10,null,null,1.08,1.06,1.065,1.02,1.025,1];const sold=values.map((v,i)=>v===null||i===1||m.sold===null?null:v*m.sold/m.ask);const gapStart=values.findIndex(v=>v===null);let gapEnd=gapStart;while(values[gapEnd+1]===null)gapEnd++;const max=m.ask*1.3,min=m.ask*.72;const x=i=>left+i*(W-left-right)/(values.length-1),y=v=>top+(max-v*m.ask)*(H-top-bottom)/(max-min);let lines='';[.8,.95,1.1,1.25].forEach(v=>lines+=`<line x1="${left}" y1="${y(v)}" x2="${W-right}" y2="${y(v)}" stroke="#edf0f3"/><text x="${left-10}" y="${y(v)+4}" fill="#6c7a89" font-size="10" text-anchor="end">${money(Math.round(m.ask*v/1000))}천</text>`);const plot=(arr,color)=>{let d='',open=false;arr.forEach((v,i)=>{if(v===null){open=false;return;}d+=`${open?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;open=true;});return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`+arr.map((v,i)=>v===null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="${i===arr.length-1?4:2.4}" fill="${color}"><title>예시 관측 ${i+1}: ${money(Math.round(v*m.ask))}원</title></circle>`).join('');};return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="chart-svg-title chart-svg-desc" preserveAspectRatio="none"><title id="chart-svg-title">${esc(m.short)} 예시 가격 추이</title><desc id="chart-svg-desc">실제 시세가 아닌 디자인용 가격입니다. 관측값이 없는 날짜의 선은 이어지지 않습니다.</desc>${lines}${plot(values,'#c94b26')}${plot(sold,'#237966')}<text x="${left}" y="${H-10}" fill="#6c7a89" font-size="10">기간 시작</text><text x="${W/2}" y="${H-10}" fill="#6c7a89" font-size="10" text-anchor="middle">${state.period}일 예시</text><text x="${W-right}" y="${H-10}" fill="#6c7a89" font-size="10" text-anchor="end">기간 종료</text><rect x="${x(gapStart)-7}" y="${top}" width="${Math.max(20,x(gapEnd)-x(gapStart)+15)}" height="${H-top-bottom}" rx="4" fill="#8b9bb20a"/><text x="${x(gapStart)-3}" y="${top+13}" fill="#84909e" font-size="9">미관측</text></svg>`;}
function analysis(){const m=current(),low=state.ui==='low';return `${heading('READ THE MARKET.','가격 흐름을 보고, 기준을 세우세요.','판매중 등록가와 판매완료 표시가를 구분해 모델별 추이를 비교하세요.',`<a class="btn heading-action" href="#market">현재 매물 보기 ${icon('arrow')}</a>`)}${cats()}<div class="panel analysis-selector"><div><label for="analysis-model">분석 모델</label><select id="analysis-model">${optionList(models.filter(x=>x.cat===state.category),state.model)}</select></div><div class="analysis-scope">${icon('filter')}<span>국내 전체 · KRW</span><button class="link-btn" data-action="scope-help">시장군 안내</button></div></div><div class="analysis-grid"><div class="analysis-content"><div class="analysis-cards"><section class="panel stat-card"><div class="metric-label"><span class="dot"></span>판매중 등록가 평균</div><strong class="num">${state.ui==='normal'?money(m.ask):'—'}${state.ui==='normal'?'<em>원</em>':''}</strong><div class="stat-bottom"><span>최근 ${state.period}일 · ${low?'2':m.n}건 / 예시</span><span class="pill ${low?'orange':'soft'}">${low?'표본 부족 · 대표값 미제공':'표시가격 기준'}</span></div></section><section class="panel stat-card"><div class="metric-label"><span class="dot teal"></span>판매완료 표시가 평균</div><strong class="num">${state.ui==='normal'&&m.sold!==null?money(m.sold):'—'}${state.ui==='normal'&&m.sold!==null?'<em>원</em>':''}</strong><div class="stat-bottom"><span>최근 ${state.period}일 · ${low?'1':m.s}건 / 예시</span><span class="pill soft">실제 체결가 아님</span></div></section></div><section class="panel chart-card"><div class="panel-head"><div><h2>${esc(m.short)}</h2><p class="chart-sub">일별 평균 가격 · 예시 관측값</p></div><div class="segmented" role="group" aria-label="예시 분석 기간">${[7,30,90].map(n=>`<button data-period="${n}" class="${state.period===n?'active':''}" aria-pressed="${state.period===n}">${n}일</button>`).join('')}</div></div>${['error','loading','empty'].includes(state.ui)?unavailable():low?`<div class="empty">${icon('chart')}<h3>대표 추세를 표시할 표본이 부족해요.</h3><p>관측값이 더 확보되면 가격 추이를 표시합니다.<br>없는 값을 0원이나 현재 가격으로 대체하지 않습니다.</p></div>`:`<div class="chart-legend"><span><i class="dot"></i>판매중 등록가</span><span><i class="dot teal"></i>판매완료 표시가</span></div><div class="chart">${chart(m)}</div>`}<div class="chart-note">${icon('info')}관측이 없는 날짜는 선을 연결하지 않습니다. 그래프와 표본은 모두 시안용 예시입니다.</div></section><section class="panel"><div class="panel-head"><h2>출처별 가격 비교</h2><span class="muted" style="font-size:11px">국내 · KRW</span></div><div class="source-row head"><div>출처</div><div>등록가 평균</div><div>완료 표시가 평균</div></div>${['중고나라','번개장터'].map((name,i)=>`<div class="source-row"><div>${name}<small>미리보기 표본</small></div><div><strong class="num">${state.ui==='normal'?money(m.ask+(i===0?-2000:2000))+'원':'—'}</strong><small>${state.ui==='normal'?'예시 통계':'대표값 미제공'}</small></div><div><strong class="num">${state.ui==='normal'&&m.sold!==null?money(m.sold+(i===0?-1000:1000))+'원':'—'}</strong><small>실제 체결가 아님</small></div></div>`).join('')}</section></div><aside class="analysis-aside"><section class="panel insight-card"><h3>${icon('shield')} 이 가격의 비교 기준</h3><dl><div><dt>비교 대상</dt><dd>${m.detail.includes('정확 모델 기준')?'정확 모델':'구간·규격 참고'}</dd></div><div><dt>시장군</dt><dd>국내 개인 중고</dd></div><div><dt>표시 통화</dt><dd>KRW (원)</dd></div><div><dt>분석 기간</dt><dd>최근 ${state.period}일 · 예시</dd></div></dl><div class="insight-divider"></div><p>${esc(m.detail)}<br><br>현재 등록가와 판매완료 표시가는 서로 다른 지표입니다. 기간과 비교 단위를 맞춰 확인하세요.</p><a href="#guide" class="btn">가격 데이터 읽는 법 ${icon('arrow')}</a></section><section class="panel insight-card"><h3>매물로 이어서 확인하세요.</h3><p>가격 차이는 상태·보증·구성품에 따라 달라질 수 있습니다. 상세 조건은 원문에서 확인하세요.</p><a class="btn primary" href="#market">현재 매물 보기 ${icon('arrow')}</a></section><div class="plain-note"><strong>디자인 상태 미리보기</strong>화면 맨 위에서 표본 부족·조회 실패·불러오는 중·결과 없음 상태를 전환할 수 있습니다. 모바일에서는 이 안내보다 가격과 그래프를 먼저 보여줍니다.</div></aside></div>`;}
function guide(){return `<div class="guide">${heading('HELP & DATA.','가격을 읽는 방법','비교 기준을 이해하면, 숫자 뒤에 있는 차이가 보입니다.')}<div class="guide-layout"><nav class="guide-index" aria-label="문서 목차"><a href="#how" data-action="guide-how">이용 순서</a><a href="#meaning" data-action="guide-meaning">가격의 의미</a><a href="#scope" data-action="guide-scope">비교 단위와 시장군</a></nav><article class="panel guide-article"><h2 id="how">세 단계로 비교하세요.</h2>${[['찾는 부품과 모델 선택','카테고리와 세부 필터로 비교하려는 모델 또는 참고 구간을 선택합니다.'],['같은 기준의 가격 확인','등록가와 판매완료 표시가를 나누어 보고, 표본과 분석 기간을 함께 확인합니다.'],['원문에서 거래 조건 확인','실제 판매 상태·보증·구성품·배송비를 원문에서 다시 확인합니다.']].map(([title,desc],i)=>`<div class="step-card"><b>${i+1}</b><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}<h2 id="meaning">판매완료 표시는 체결가가 아닙니다.</h2><p>판매중 등록가는 현재 매물에 표시된 가격입니다. 판매완료 표시가는 판매완료 상태에서 확인한 마지막 표시가격이며 실제 체결가와 다를 수 있습니다.</p><p>표본이 부족하거나 통계를 제공할 수 없는 경우에는 그 이유를 표시합니다. 데이터가 없는 상태를 0원으로 해석하지 않습니다.</p><h2 id="scope">같은 단위끼리 비교해야 합니다.</h2><p>정확 모델 시세와 제조사·용량·출력 구간의 참고 시세는 구분합니다. RAM의 경우 모듈 1개 가격과 구성 전체 가격을 혼동하지 않도록 수량을 함께 봅니다.</p><p>국내 중고·리퍼비시·해외 중고는 다른 시장군입니다. KRW와 USD를 환율 적용 없이 같은 합계나 가격순 목록으로 섞지 않습니다.</p><div class="summary-note" style="margin-bottom:0">이 페이지 역시 UI 시안입니다. 실제 이용 안내·개인정보처리방침·이용약관의 운영 문구는 별도 확인 없이 변경하지 않습니다.</div></article></div></div>`;}
function render(keepScroll=false){const y=window.scrollY;document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===state.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});$('#main').innerHTML=({market,builder,analysis,guide}[state.page]||market)();if(keepScroll)window.scrollTo(0,y);}
function syncRoute(){const page=location.hash.slice(1)||'market';if(!['market','builder','analysis','guide'].includes(page))return;state.page=page;render();window.scrollTo(0,0);}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3600);}
function setModel(id){const m=byId(id);if(!m)return;state.model=id;state.category=m.cat;render(true);}
function reset(){state.query='';state.brand='전체';state.source='전체';state.sort='recent';state.ui='normal';$('#preview-state').value='normal';const m=models.find(m=>m.cat===state.category);if(m)state.model=m.id;render(true);}
function choose(cat){state.picker=cat;$('#dialog-title').textContent=group(cat)[1]+' 선택 · 예시';$('#dialog-body').innerHTML=`<p class="muted" style="font-size:11px;padding:8px 0">실제 제품 추천이 아닌 시안용 예시 목록입니다.</p>`+models.filter(m=>m.cat===cat).map(m=>`<button class="choice" data-choose="${m.id}"><span>${esc(m.name)}<small>${esc(m.detail)}</small></span><strong>${money(m.ask)}원</strong></button>`).join('');$('#choose-dialog').showModal();}
function load(){try{const data=JSON.parse(localStorage.getItem('usedpick_ui_concept_a_only')||'null');if(!data||typeof data!=='object')return toast('저장된 시안 구성이 없습니다.');const safe={};for(const [cat,v] of Object.entries(data)){const m=byId(v?.id);if(m&&m.cat===cat&&Number.isInteger(v.q)&&v.q>=1&&v.q<=8)safe[cat]={id:m.id,q:v.q};}state.build=safe;render(true);toast('이 브라우저에 저장한 시안 구성을 불러왔습니다.');}catch{toast('이 브라우저에서는 저장 내용을 불러올 수 없습니다.');}}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(t.dataset.category){state.category=t.dataset.category;state.brand='전체';state.query='';state.model=models.find(m=>m.cat===state.category).id;render(true);}if(t.dataset.source){state.source=t.dataset.source;render(true);}if(t.dataset.period){state.period=Number(t.dataset.period);render(true);}if(t.dataset.pick)choose(t.dataset.pick);if(t.dataset.choose){const m=byId(t.dataset.choose);if(m){state.build[m.cat]={id:m.id,q:state.build[m.cat]?.q||1};$('#choose-dialog').close();render(true);toast('시안 구성에 '+m.short+'을(를) 반영했습니다.');}}if(t.dataset.qty){const v=state.build[t.dataset.qty];if(v){v.q=Math.max(1,Math.min(8,v.q+Number(t.dataset.delta)));render(true);}}if(t.dataset.remove){delete state.build[t.dataset.remove];render(true);toast('시안 구성에서 삭제했습니다.');}const action=t.dataset.action;if(!action)return;if(['jump-summary','guide-how','guide-meaning','guide-scope'].includes(action)){e.preventDefault();$(action==='jump-summary'?'#build-summary':'#'+action.split('-')[1])?.scrollIntoView({behavior:'smooth'});return;}const actions={reset, recover:reset,'open-filter':()=>$('#filter-panel').classList.add('is-open'),'close-filter':()=>$('#filter-panel').classList.remove('is-open'),'close-dialog':()=>$('#choose-dialog').close(),original:()=>toast('디자인 예시입니다. 실제 매물 원문으로 연결되지 않습니다.'),'scope-help':()=>toast('국내 중고·리퍼·해외 중고는 분리합니다. 이 시안은 국내 KRW 예시만 제공합니다.'),legal:()=>toast('운영 약관은 수정하지 않았습니다. 이 시안에는 법률 문서를 복제하지 않았습니다.'),save:()=>{try{localStorage.setItem('usedpick_ui_concept_a_only',JSON.stringify(state.build));toast('시안 구성을 저장했습니다. 운영 견적에는 영향이 없습니다.');}catch{toast('이 브라우저에서는 저장이 허용되지 않습니다.');}},load,print:()=>window.print()};actions[action]?.();});
document.addEventListener('change',e=>{if(e.target.id==='preview-state'){state.ui=e.target.value;render(true);}else if(['market-model','analysis-model','filter-model'].includes(e.target.id))setModel(e.target.value);else if(e.target.name==='brand'){state.brand=e.target.value;const match=selectedModels();if(match.length)state.model=match[0].id;render(true);}else if(e.target.id==='sort'){state.sort=e.target.value;render(true);}});
document.addEventListener('input',e=>{if(e.target.id==='model-search'){state.query=e.target.value;const start=e.target.selectionStart;const match=selectedModels();if(match.length)state.model=match[0].id;const open=$('#filter-panel')?.classList.contains('is-open');render(true);if(open)$('#filter-panel')?.classList.add('is-open');const input=$('#model-search');input?.focus();try{input?.setSelectionRange(start,start);}catch{}}});
window.addEventListener('hashchange',syncRoute);window.matchMedia('(max-width:600px)').addEventListener('change',()=>{if(state.page==='analysis')render(true);});syncRoute();
</script>
</body>
</html>
