<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>USED PICK 스토어 소개 이미지</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e6e4de;color:#111822;font-family:"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
    .sheet{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);--bg:#f5f3ec;--fg:#111822;--muted:#5b615f;--accent:#c94a1c;--line:#dbdcd5}
    .sheet.orange{--bg:#c94a1c;--fg:#fffdf7;--muted:#ffe3d4;--accent:#fffdf7;--line:#e7865f}.sheet.ink{--bg:#111822;--fg:#f8f7f0;--muted:#c4cbd1;--accent:#b7e1c2;--line:#43505b}.sheet.mint{--bg:#c8e6ce;--fg:#111822;--muted:#3d5747;--accent:#a33e1b;--line:#9fc5a7}
    .sheet:after{content:"";width:810px;height:810px;border:1px solid var(--line);border-radius:50%;position:absolute;right:-420px;top:-360px;pointer-events:none}
    .mast{position:absolute;top:49px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;z-index:1}.wordmark{font-family:Bahnschrift,sans-serif;font-weight:700;letter-spacing:1.2px;font-size:28px}.wordmark em{font-style:normal;color:var(--accent)}.topic{font-size:23px;font-weight:700;color:var(--muted);letter-spacing:-.5px}
    .copy{position:absolute;top:120px;left:64px;right:50px;z-index:1}.copy h1{margin:0;font-size:82px;line-height:1.17;letter-spacing:-5.4px;font-weight:700;white-space:pre-line}.copy p{margin:24px 0 0;font-size:29px;line-height:1.45;letter-spacing:-1px;color:var(--muted);font-weight:400}
    .screen{position:absolute;left:52px;top:408px;width:976px;height:1464px;overflow:hidden;border:1px solid rgba(17,24,34,.14);border-radius:18px;background:white;z-index:1;box-shadow:0 18px 40px rgba(17,24,34,.10)}
    .screen img{display:block;width:976px;height:auto;max-width:none;transform:translateY(-123px)}
    .sheet.ink .screen{left:135px;width:810px}.sheet.ink .screen img{width:810px;transform:translateY(-102px)}
    .sheet.mint .screen{left:105px;width:870px;height:1410px}.sheet.mint .screen img{width:870px;transform:translateY(-110px)}
    .sheet.character{--bg:#df5f25;--fg:#fffaf3;--muted:#ffe3cf;--accent:#fffaf3;--line:#ee8b5c}
    .sheet.character .screen{top:1010px;height:862px;border-color:rgba(74,47,34,.18);box-shadow:0 18px 40px rgba(74,30,10,.22)}
    .sheet.character .disc{position:absolute;left:432px;top:452px;width:620px;height:620px;border-radius:50%;background:#fff3e4}
    .sheet.character .char{position:absolute;left:500px;top:478px;width:500px;height:auto;z-index:2}
    .sheet.character .name{position:absolute;left:64px;top:690px;z-index:1}.sheet.character .name b{display:block;font-size:76px;letter-spacing:-3px;line-height:1}.sheet.character .name span{display:block;white-space:pre-line;margin-top:16px;font-size:25px;line-height:1.45;letter-spacing:-.8px;color:var(--muted)}
    .foot{position:absolute;bottom:20px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;font-family:Bahnschrift,"Malgun Gothic",sans-serif;color:var(--muted);font-size:15px;letter-spacing:.5px}.foot span:last-child{width:78px;height:4px;background:var(--accent)}
    .feature{width:1024px;height:500px;background:#f5f3ec;position:relative;overflow:hidden;color:#111822}.feature:before{content:"";position:absolute;width:560px;height:560px;left:691px;top:-160px;border:85px solid #c8e6ce;border-radius:50%}.feature .brand{position:absolute;top:57px;left:54px;font-family:Bahnschrift,sans-serif;font-size:28px;font-weight:700;letter-spacing:1px}.feature .brand em{font-style:normal;color:#c94a1c}.feature h1{position:absolute;left:51px;top:111px;margin:0;font-size:58px;line-height:1.2;letter-spacing:-3.5px;z-index:2}.feature h1 span{color:#c94a1c}.feature p{position:absolute;left:54px;top:305px;font-size:20px;line-height:1.5;letter-spacing:-.8px;margin:0;color:#515c56;z-index:2}.feature .rule{position:absolute;left:54px;top:378px;width:58px;height:5px;background:#c94a1c}.feature .capture{position:absolute;top:40px;left:660px;width:317px;height:460px;overflow:hidden;border:1px solid #d7d9d2;border-radius:12px;background:white;box-shadow:0 16px 24px rgba(17,24,34,.10)}.feature .capture img{display:block;width:317px;height:auto;transform:translateY(-40px)}
    body.gallery{padding:48px}.gallery>header{max-width:1280px;margin:0 auto 32px}.gallery>header h1{font-size:30px;margin:0 0 10px}.gallery>header p{margin:0;color:#58645c;font-size:15px}.gallery main{max-width:1280px;margin:auto}.gallery .feature-wrap{width:100%;overflow:hidden;margin-bottom:30px}.gallery .feature{transform-origin:top left}.gallery .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.gallery figure{margin:0}.gallery .preview{width:100%;aspect-ratio:9/16;overflow:hidden;position:relative}.gallery .sheet{transform:scale(var(--scale));transform-origin:top left}.gallery figcaption{font-size:14px;margin-top:10px;color:#4e5b53}.gallery .copy-preview{margin:40px 0 0;border-top:1px solid #bfc6bf;padding-top:25px;max-width:850px}.gallery .copy-preview h2{font-size:20px}.gallery .copy-preview p{white-space:pre-line;font-size:16px;line-height:1.8}.gallery a{color:#934221;text-underline-offset:4px}@media(max-width:700px){body.gallery{padding:24px 18px}.gallery .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.gallery>header h1{font-size:24px}.gallery .feature-wrap{height:auto}}
  </style>
</head>
<body>
  <script>
    // The renderer injects a local, versioned content file. App pixels remain raw captures.
    const rawBase='../artifacts/0.1.0/store-v2/raw/';
    function sheet(item){const a=document.createElement('article');a.className='sheet '+item.theme;a.id=item.id;a.innerHTML='<div class="mast"><div class="wordmark">USED <em>PICK</em></div><div class="topic"></div></div><div class="copy"><h1></h1><p></p></div><div class="screen"><img></div><div class="foot"><span></span><span></span></div>';a.querySelector('.topic').textContent=item.label;a.querySelector('h1').textContent=item.title;a.querySelector('.copy p').textContent=item.subtitle;const im=a.querySelector('img');im.src=rawBase+item.raw;im.alt=item.alt;if(item.character){const disc=document.createElement('div');disc.className='disc';const ch=document.createElement('img');ch.className='char';ch.src=item.character.src;ch.alt='';const name=document.createElement('div');name.className='name';const b=document.createElement('b');b.textContent=item.character.name;const s=document.createElement('span');s.textContent=item.character.tagline;name.append(b,s);a.append(disc,name,ch)}return a}
    function feature(data){const a=document.createElement('article');a.className='feature';a.id='feature';a.innerHTML='<div class="brand">USED <em>PICK</em></div><h1>중고 PC 부품,<br><span>비교의 기준을 찾다.</span></h1><p>매물 검색 · 가격 분석 · 컴퓨터 시세</p><div class="rule"></div><div class="capture"><img></div>';a.querySelector('img').src=rawBase+data.graphics[0].raw;a.querySelector('img').alt=data.graphics[0].alt;return a}
    window.renderStoreArtwork=function(data){const id=new URLSearchParams(location.search).get('art');document.body.replaceChildren();if(id==='feature'){document.body.append(feature(data));return}if(id){const item=data.graphics.find(x=>x.id===id);if(!item)throw Error('Unknown artwork');document.body.append(sheet(item));return}document.body.className='gallery';const h=document.createElement('header');h.innerHTML='<h1>USED PICK · 스토어 소개</h1><p>한국어 소개 문구와 실제 앱 화면을 담은 이미지.</p>';document.body.append(h);const main=document.createElement('main'),fw=document.createElement('div');fw.className='feature-wrap';fw.append(feature(data));main.append(fw);const grid=document.createElement('div');grid.className='grid';data.graphics.forEach(item=>{const f=document.createElement('figure'),p=document.createElement('div');p.className='preview';p.append(sheet(item));f.append(p);const c=document.createElement('figcaption');c.textContent=item.label;f.append(c);grid.append(f)});main.append(grid);const copy=document.createElement('section');copy.className='copy-preview';const heading=document.createElement('h2');heading.textContent=data.name;const short=document.createElement('p');short.textContent=data.shortDescription;const full=document.createElement('p');full.textContent=data.fullDescription;copy.append(heading,short,full);main.append(copy);document.body.append(main);function fit(){document.querySelectorAll('.preview').forEach(x=>x.style.setProperty('--scale',x.clientWidth/1080));const s=Math.min(fw.clientWidth/1024,1);fw.querySelector('.feature').style.transform='scale('+s+')';fw.style.height=500*s+'px'}fit();addEventListener('resize',fit)};
  </script>
  <script src="listing-data.js"></script>
</body>
</html>
