server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/used-market-global-redirect.access.log;
    error_log /var/log/nginx/used-market-global-redirect.error.log warn;

    include /etc/nginx/snippets/used-market-global-security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 308 https://global.used-pick.com$request_uri;
}
