limit_req_zone $binary_remote_addr zone=used_market_global_search_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=used_market_global_refresh_ip:10m rate=30r/m;
limit_conn_zone $server_name zone=used_market_global_search_host:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 32k;
    access_log /var/log/nginx/used-market-global.access.log;
    error_log /var/log/nginx/used-market-global.error.log warn;

    include /etc/nginx/snippets/used-market-global-security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @used_market_global_rate_limited;

    location @used_market_global_rate_limited {
        include /etc/nginx/snippets/used-market-global-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Retry-After "15" always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after_seconds":15}';
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = / {
        return 308 /global/?country=jp;
    }

    location = /global {
        return 308 /global/?country=jp;
    }

    location = /global/health {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/used-market-global-proxy-params.conf;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        access_log off;
    }

    location = /global/api/categories {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/used-market-global-proxy-params.conf;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /global/api/search {
        if ($request_method != POST) { return 405; }
        limit_req zone=used_market_global_search_ip burst=2 nodelay;
        limit_conn used_market_global_search_host 1;
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/used-market-global-proxy-params.conf;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location ^~ /global/api/search/refresh/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=used_market_global_refresh_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/used-market-global-proxy-params.conf;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /global/api/ {
        return 404;
    }

    location ^~ /api {
        return 404;
    }

    location = /health {
        return 404;
    }

    location ^~ /health/ {
        return 404;
    }

    location ^~ /global/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/used-market-global-proxy-params.conf;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
