name: used-market-global-app

services:
  used-market-global:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      LOCAL_BROWSER_BINARY: /usr/bin/chromium
      LOCAL_BROWSER_COMMAND_TIMEOUT_MS: "15000"
      NODE_OPTIONS: "--max-old-space-size=900"
      PUBLIC_API_ONLY: "true"
      SEARCH_CONCURRENCY_LIMIT: "1"
      SEARCH_RETRY_AFTER_SECONDS: "5"
      SEARCH_MAX_WORK_UNITS: "12"
      SEARCH_CACHE_TTL_SECONDS: "120"
      SEARCH_CACHE_MAX_ENTRIES: "32"
      LOCAL_BROWSER_NO_SANDBOX: "true"
    cpus: 0.9
    mem_limit: 1800m
    mem_reservation: 512m
    memswap_limit: 2200m
    pids_limit: 320
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: "512mb"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node/.cache:size=128m,uid=1000,gid=1000,mode=0700
      - /app/tmp:size=128m,uid=1000,gid=1000,mode=0700
    volumes:
      - used-market-global-results:/app/merge/result
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/global/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  used-market-global-results:
    name: used-market-global_results
